<title>TM Easy Dutch</title>
<style>
:root{
  --delft: #1B3A6B;
  --delft-deep: #12294D;
  --delft-mid: #3E6FA8;
  --delft-pale: #CFE0F0;
  --porcelain: #F6F3EC;
  --porcelain-2: #EFEAE0;
  --ochre: #CE9B3F;
  --ochre-deep: #A97B28;
  --ink: #1E2430;
  --ink-soft: #5B6472;
  --good: #3E7D5B;
  --bad: #B14A3D;
  --radius: 14px;
  --shadow: 0 8px 24px rgba(18,41,77,0.12);
  --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--porcelain);
  color:var(--ink);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:78px;position:relative;}
.topbar{
  background:linear-gradient(160deg,var(--delft) 0%, var(--delft-deep) 100%);
  color:#fff;padding:22px 20px 20px;position:relative;overflow:hidden;border-bottom:3px solid var(--ochre);
}
.topbar::after{content:"";position:absolute;inset:0;
  background-image: radial-gradient(circle at 10% 20%, rgba(255,255,255,0.06) 0, transparent 40%),
                     radial-gradient(circle at 90% 80%, rgba(255,255,255,0.05) 0, transparent 45%);
  pointer-events:none;}
.brand{display:flex;align-items:baseline;gap:10px;position:relative;z-index:1;}
.brand-mark{width:36px;height:36px;border-radius:9px;background:var(--porcelain);display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;color:var(--delft);font-size:14px;flex-shrink:0;box-shadow: inset 0 0 0 2px var(--delft-pale);}
h1.title{font-family:var(--font-display);font-weight:700;font-size:23px;margin:0;letter-spacing:0.2px;}
.subtitle{font-size:12px;opacity:0.75;margin-top:2px;font-weight:500;letter-spacing:0.3px;}
.stats-row{display:flex;gap:10px;margin-top:16px;position:relative;z-index:1;}
.stat-pill{flex:1;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.14);border-radius:12px;padding:9px 6px;text-align:center;}
.stat-pill b{display:block;font-size:19px;font-family:var(--font-display);font-weight:700;}
.stat-pill span{font-size:10.5px;opacity:0.75;text-transform:uppercase;letter-spacing:0.5px;}
.stat-pill.new b{color:#EAF2FF;} .stat-pill.rep b{color:#FFE3B8;} .stat-pill.learned b{color:#C9F0D8;}
main{flex:1;padding:18px 16px 8px;}
.tabbar{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:#fff;border-top:1px solid var(--porcelain-2);display:flex;box-shadow: 0 -4px 18px rgba(18,41,77,0.08);z-index:20;}
.tabbar button{flex:1;background:none;border:none;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink-soft);font-family:var(--font-body);font-size:9.5px;font-weight:600;cursor:pointer;}
.tabbar button .ic{font-size:17px;line-height:1;}
.tabbar button.active{color:var(--delft);}
.card{background:#fff;border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px;border:1px solid rgba(18,41,77,0.05);}
.section-title{font-family:var(--font-display);font-weight:700;font-size:17px;margin:0 0 12px;color:var(--delft-deep);}
.muted{color:var(--ink-soft);font-size:13.5px;line-height:1.5;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:11px;border:none;font-family:var(--font-body);font-weight:600;font-size:14.5px;cursor:pointer;width:100%;}
.btn-primary{background:var(--delft);color:#fff;}
.btn-primary:active{background:var(--delft-deep);}
.btn-ghost{background:var(--porcelain-2);color:var(--ink);}
.btn-outline{background:#fff;color:var(--delft);border:1.5px solid var(--delft-pale);}
.btn-danger{background:#fff;color:var(--bad);border:1.5px solid #ecd0cb;}
.btn:disabled{opacity:0.45;}
.btn-row{display:flex;gap:10px;}
.deck-wrap{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.progress-line{width:100%;display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-bottom:10px;font-weight:600;}
.tile-card{width:100%;min-height:280px;background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:26px 22px;position:relative;display:flex;flex-direction:column;border:1px solid rgba(18,41,77,0.06);}
.tile-card::before{content:"";position:absolute;top:10px;left:10px;right:10px;bottom:10px;border:1.5px solid var(--delft-pale);border-radius:12px;pointer-events:none;}
.tile-corner{position:absolute;width:22px;height:22px;opacity:0.55;top:14px;left:14px;}
.card-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px 6px;position:relative;z-index:1;}
.article-badge{font-family:var(--font-display);font-size:13px;font-weight:700;color:var(--ochre-deep);background:#FCF1DC;border-radius:8px;padding:2px 10px;margin-bottom:8px;letter-spacing:0.5px;}
.article-badge.de{color:var(--delft);background:#DCE9FA;}
.article-badge.het{color:var(--ochre-deep);background:#FCEFD6;}
.nl-word{font-family:var(--font-display);font-weight:700;font-size:34px;color:var(--delft-deep);line-height:1.15;}
.pos-tag{font-size:11.5px;color:var(--ink-soft);margin-top:6px;text-transform:uppercase;letter-spacing:0.6px;font-weight:600;}
.reveal-hint{font-size:12.5px;color:var(--ink-soft);margin-top:16px;}
.back-block{width:100%;text-align:left;position:relative;z-index:1;}
.tr-ru{font-size:22px;font-weight:700;color:var(--ink);text-align:center;margin-bottom:4px;}
.tr-en{font-size:14px;color:var(--ink-soft);text-align:center;margin-bottom:16px;}
.mnemo-box{background:var(--porcelain);border-left:4px solid var(--ochre);border-radius:0 10px 10px 0;padding:11px 13px;margin-bottom:10px;}
.mnemo-label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.6px;color:var(--ochre-deep);font-weight:700;margin-bottom:3px;}
.mnemo-text{font-size:14.5px;font-weight:600;color:var(--ink);}
.story-box{background:var(--delft-pale);border-radius:10px;padding:11px 13px;}
.story-label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.6px;color:var(--delft-deep);font-weight:700;margin-bottom:3px;}
.story-text{font-size:13.5px;line-height:1.5;color:var(--delft-deep);}
.example-box{margin-top:10px;font-size:13px;color:var(--ink-soft);font-style:italic;background:#fbfaf6;border-radius:10px;padding:9px 12px;}
.grade-row{display:flex;gap:8px;margin-top:14px;width:100%;}
.grade-btn{flex:1;border:none;border-radius:11px;padding:12px 6px;font-family:var(--font-body);font-weight:700;font-size:13px;color:#fff;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center;}
.grade-btn small{font-weight:500;font-size:10px;opacity:0.85;}
.g-again{background:var(--bad);} .g-good{background:var(--delft-mid);} .g-easy{background:var(--good);}
.empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
.empty-state .big{font-size:40px;margin-bottom:10px;}
label.field-label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin:14px 0 6px;text-transform:uppercase;letter-spacing:0.4px;}
label.field-label:first-child{margin-top:0;}
input[type=text], textarea, select{width:100%;padding:11px 13px;border-radius:10px;border:1.5px solid var(--porcelain-2);background:var(--porcelain);font-family:var(--font-body);font-size:14.5px;color:var(--ink);}
textarea{resize:vertical;min-height:60px;}
.seg{display:flex;gap:8px;}
.seg button{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--porcelain-2);background:#fff;font-weight:700;font-family:var(--font-display);font-size:14.5px;color:var(--ink-soft);cursor:pointer;}
.seg button.sel{border-color:var(--delft);color:var(--delft);background:var(--delft-pale);}
.search-bar{position:relative;margin-bottom:12px;}
.search-bar input{padding-left:36px;}
.search-ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-soft);font-size:15px;}
.word-row{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--porcelain-2);cursor:pointer;}
.word-row:last-child{border-bottom:none;}
.wr-left{display:flex;flex-direction:column;}
.wr-nl{font-weight:700;font-size:15px;}
.wr-ru{font-size:12.5px;color:var(--ink-soft);}
.badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:0.3px;}
.badge.new{background:#E9EEF7;color:var(--delft-mid);}
.badge.learning{background:#FCEFD6;color:var(--ochre-deep);}
.badge.review{background:#E3F1E9;color:var(--good);}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--porcelain-2);}
.setting-row:last-child{border-bottom:none;}
.setting-label{font-weight:600;font-size:14.5px;}
.setting-desc{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.number-stepper{display:flex;align-items:center;gap:12px;}
.number-stepper button{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--porcelain-2);background:#fff;font-size:17px;font-weight:700;color:var(--delft);cursor:pointer;}
.number-stepper b{min-width:24px;text-align:center;font-family:var(--font-display);font-size:16px;}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--delft-deep);color:#fff;padding:11px 18px;border-radius:30px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);z-index:50;opacity:0;pointer-events:none;transition:opacity 0.25s, transform 0.25s; max-width:88%; text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
.hidden{display:none !important;}
.top-actions{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.icon-btn{background:none;border:none;font-size:20px;color:var(--delft);cursor:pointer;padding:4px 8px;}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.chip{padding:7px 13px;border-radius:20px;background:#fff;border:1.5px solid var(--porcelain-2);font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
.chip.sel{background:var(--delft);border-color:var(--delft);color:#fff;}
footer.appfoot{text-align:center;font-size:11.5px;color:var(--ink-soft);padding:16px 20px 6px;line-height:1.5;}
.offline-banner{background:#FCEFD6;color:var(--ochre-deep);font-size:12px;font-weight:600;text-align:center;padding:7px 10px;border-radius:10px;margin-bottom:12px;}
</style>
</head>

swer","ru":"отвечать","pos":"verb","level":"b1","mnemonic":"«антвордэн» — «ответ» + «ворд» (слово)","story":"«ОТВЕТное слово» дословно — antwoorden, «отвечать».","example_nl":"Ze antwoordde snel.","example_ru":"Она быстро ответила.","example_en":"She answered quickly.","id":"w_antwoorden","batch":1},{"nl":"geloven","article":null,"en":"to believe","ru":"верить","pos":"verb","level":"b1","mnemonic":"«хэловен» созвучно с «голова» веры полна","story":"ГОЛОВА полна веры — geloven, «верить».","example_nl":"Ik geloof je niet.","example_ru":"Я тебе не верю.","example_en":"I don't believe you.","id":"w_geloven","batch":1},{"nl":"hopen","article":null,"en":"to hope","ru":"надеяться","pos":"verb","level":"b1","mnemonic":"«хопен» — как «хоп!» с надеждой прыгнуть","story":"«Хоп!» — прыгаешь с надеждой на удачу — hopen.","example_nl":"Ik hoop op mooi weer.","example_ru":"Я надеюсь на хорошую погоду.","example_en":"I hope for nice weather.","id":"w_hopen","batch":1},{"nl":"ontmoeten","article":null,"en":"to meet","ru":"встречать","pos":"verb","level":"b1","mnemonic":"«онтмутен» — «он» + «мутить» встречу","story":"«Он мутит встречу» — вот и ontmoeten, «встречать».","example_nl":"Ik ontmoet mijn vriend in het park.","example_ru":"Я встречаю друга в парке.","example_en":"I am meeting my friend in the park.","id":"w_ontmoeten","batch":1},{"nl":"bezoeken","article":null,"en":"to visit","ru":"посещать","pos":"verb","level":"b1","mnemonic":"«бэзукен» созвучно с «базука» в гости","story":"Приходишь в гости с БАЗУКОй игрушечной — bezoeken, «посещать».","example_nl":"We bezoeken oma in het weekend.","example_ru":"Мы навещаем бабушку на выходных.","example_en":"We visit grandma on the weekend.","id":"w_bezoeken","batch":1},{"nl":"reizen","article":null,"en":"to travel","ru":"путешествовать","pos":"verb","level":"a2","mnemonic":"«рэйзен» созвучно с «рейс» (авиарейс)","story":"Садишься на РЕЙС и летишь — reizen, «путешествовать».","example_nl":"Ik reis graag door Europa.","example_ru":"Я любл s":"verb","level":"a2","mnemonic":"звучит почти так же, как «контролировать»","story":"Controleren почти не отличается от «контролировать».","example_nl":"Kun je mijn huiswerk controleren?","example_ru":"Можешь проверить моё домашнее задание?","example_en":"Can you check my homework?","id":"w_controleren","batch":2},{"nl":"herinneren","article":null,"en":"to remember, to remind","ru":"напоминать, вспоминать","pos":"verb","level":"b1","mnemonic":"«хэриннерен» — «хер» + «иннерен» созвучно с «внутренний» — хранишь внутри память","story":"Хранишь память глубоко ВНУТРИ (innerlijk) — herinneren, «вспоминать».","example_nl":"Dit herinnert me aan mijn jeugd.","example_ru":"Это напоминает мне о моём детстве.","example_en":"This reminds me of my childhood.","id":"w_herinneren","batch":2},{"nl":"vergeten","article":null,"en":"to forget","ru":"забывать","pos":"verb","level":"a2","mnemonic":"«фэрхэтен» созвучно с «вергетон» — забыл, как этот забавный жетон называется","story":"Забыл, куда дел жетон (neteton) — vergeten, «забывать».","example_nl":"Ik ben mijn wachtwoord vergeten.","example_ru":"Я забыл свой пароль.","example_en":"I forgot my password.","id":"w_vergeten","batch":2},{"nl":"voorstellen","article":null,"en":"to suggest, to propose, to introduce","ru":"предлагать, представлять (кого-то)","pos":"verb","level":"b1","mnemonic":"«вор» (перед) + «стеллен» (ставить) — поставить предложение перед всеми","story":"Ставишь идею ПЕРЕД (voor) всеми на обсуждение — voorstellen, «предлагать».","example_nl":"Ik stel voor om te stoppen.","example_ru":"Я предлагаю остановиться.","example_en":"I suggest we stop.","id":"w_voorstellen","batch":2},{"nl":"verwachten","article":null,"en":"to expect","ru":"ожидать","pos":"verb","level":"b1","mnemonic":"«ферваххтен» — «вер» + «вахтен» (ждать) — ждать с нетерпением, ожидать","story":"От wachten («ждать») с приставкой — verwachten, «ожидать».","example_nl":"Ik verwacht een pakket vandaag.","example_ru":"Я жду посылку сегодня.","example_en":"I am expecting a package today.","id":"w_verwachten","batch":2},{"nl":"waarderen","article":null,"en":"to appreciate","ru":"ценить","pos":"verb","level":"b1","mnemonic":"звучит почти как «вардировать» — ценить, будто оценивать по вардовой шкале","story":"Оцениваешь по особой шкале и очень ценишь — waarderen.","example_nl":"Ik waardeer je hulp echt.","example_ru":"Я правда ценю твою помощь.","example_en":"I really appreciate your help.","id":"w_waarderen","batch":2},{"nl":"verdienen","article":null,"en":"to earn, to deserve","ru":"зарабатывать, заслуживать","pos":"verb","level":"b1","mnemonic":"«фердинен» созвучно с «вертеть деньги» — зарабатывать, вертя дела","story":"Вертишься целый день, чтобы заработать — verdienen.","example_nl":"Hij verdient goed geld.","example_ru":"Он хорошо зарабатывает.","example_en":"He earns good money.","id":"w_verdienen","batch":2},{"nl":"ontdekken","article":null,"en":"to discover","ru":"обнаруживать, открывать (научно)","pos":"verb","level":"b1","mnemonic":"«онтдэккен» — «онт» + «деккен» (накрывать) — снять покрывало и обнаружить","story":"Снимаешь покрывало (dekken) и обнаруживаешь секрет — ontdekken, «открывать».","example_nl":"Wetenschappers ontdekten een nieuwe planeet.","example_ru":"Учёные открыли новую планету.","example_en":"Scientists discovered a new planet.","id":"w_ontdekken","batch":2},{"nl":"beschrijven","article":null,"en":"to describe","ru":"описывать","pos":"verb","level":"b1","mnemonic":"«бэ» + «схрайвен» (писать) — писать вокруг темы, описывать","story":"От schrijven («писать») с приставкой be- — beschrijven, «описывать».","example_nl":"Kun je de dief beschrijven?","example_ru":"Можешь описать вора?","example_en":"Can you describe the thief?","id":"w_beschrijven","batch":2},{"nl":"voorzichtig","article":null,"en":"careful","ru":"осторожный","pos":"adj","level":"b1","mnemonic":"«ворзихтих» — «вор» (перед) + «зихт» (взгляд) — смотрит вперёд осторожно","story":"Смотрит далеко ВПЕРЁД (voor), прежде чем ступить — voorzichtig, «осторожный».","example_nl":"Wees voorzichtig op de weg.","example_ru":"Будь осторожен на дороге.","example_en":"Be careful on the road.","id":"w_voorzichtig","batch":2},{"nl":"nieuwsgierig","article":null,"en":"curious","ru":"любопытный","pos":"adj","level":"b1","mnemonic":"«ниусхирих» — «ниус» (новость) + «гирих» (жадный) — жадный до новостей","story":"Жадный до новостей (nieuws) — nieuwsgierig, «любопытный».","example_nl":"Kinderen zijn erg nieuwsgierig.","example_ru":"Дети очень любопытны.","example_en":"Children are very curious.","id":"w_nieuwsgierig","batch":2},{"nl":"verlegen","article":null,"en":"shy","ru":"застенчивый","pos":"adj","level":"b1","mnemonic":"«ферлэйхен» созвучно с «в лежку» — застенчиво лёг и молчит в уголке","story":"Застенчиво лёг (leggen) в уголке и молчит — verlegen.","example_nl":"Ze is verlegen bij vreemden.","example_ru":"Она застенчива с незнакомцами.","example_en":"She is shy around strangers.","id":"w_verlegen","batch":2},{"nl":"zelfverzekerd","article":null,"en":"confident","ru":"уверенный в себе","pos":"adj","level":"b2","mnemonic":"«зельф» (сам) + «ферзэйкерд» (застрахован) — застраховал сам себя уверенностью","story":"Сам себя «застраховал» уверенностью — zelfverzekerd.","example_nl":"Hij spreekt zelfverzekerd voor de groep.","example_ru":"Он уверенно говорит перед группой.","example_en":"He speaks confidently in front of the group.","id":"w_zelfverzekerd","batch":2},{"nl":"eerlijk","article":null,"en":"honest","ru":"честный","pos":"adj","level":"a2","mnemonic":"«эйрлэйк» созвучно с «эр» (честь) — говорит по чести","story":"Говорит по ЧЕСТИ (eer) — eerlijk, «честный».","example_nl":"Wees eerlijk tegen mij.","example_ru":"Будь со мной честен.","example_en":"Be honest with me.","id":"w_eerlijk","batch":2},{"nl":"beleefd","article":null,"en":"polite","ru":"вежливый","pos":"adj","level":"b1","mnemonic":"«бэлейфт» созвучно с «believe it» — веришь в его вежливость","story":"Настолько вежлив, что даже не верится (believe it) — belee ome.","id":"w_zodra","batch":2},{"nl":"inmiddels","article":null,"en":"meanwhile, by now","ru":"тем временем, уже","pos":"adv","level":"b2","mnemonic":"«инмиддельс» — «ин» + «миддельс» (средний) — в середине событий, тем временем","story":"Прямо в СЕРЕДИНЕ (midden) событий — inmiddels, «тем временем».","example_nl":"Inmiddels is het al laat geworden.","example_ru":"Тем временем уже стало поздно.","example_en":"Meanwhile, it has already gotten late.","id":"w_inmiddels","batch":2},{"nl":"overigens","article":null,"en":"by the way, moreover","ru":"кстати, впрочем","pos":"adv","level":"b2","mnemonic":"«оверихенс» созвучно с «овер» (сверх) — сверх того, кстати говоря","story":"«Сверх того» ещё кое-что скажу — overigens, «кстати».","example_nl":"Overigens, heb je mijn bericht gezien?","example_ru":"Кстати, ты видел моё сообщение?","example_en":"By the way, did you see my message?","id":"w_overigens","batch":2},{"nl":"uiteindelijk","article":null,"en":"eventually, finally","ru":"в конце концов","pos":"adv","level":"b1","mnemonic":"«эйтэйндэлэйк» — «эйт» (из) + «эйнде» (конец) — в итоге, из самого конца","story":"Дошли до самого КОНЦА (einde) — uiteindelijk, «в конце концов».","example_nl":"Uiteindelijk kwamen we tot een besluit.","example_ru":"В конце концов мы пришли к решению.","example_en":"Eventually, we reached a decision.","id":"w_uiteindelijk","batch":2},{"nl":"blijkbaar","article":null,"en":"apparently","ru":"по-видимому, очевидно","pos":"adv","level":"b1","mnemonic":"от blijken (оказываться) — как оказалось","story":"От blijken («оказываться») — blijkbaar, «по-видимому».","example_nl":"Blijkbaar heeft hij het vergeten.","example_ru":"По-видимому, он это забыл.","example_en":"Apparently, he forgot it.","id":"w_blijkbaar","batch":2},{"nl":"duidelijk","article":null,"en":"clear, obvious","ru":"ясный, понятный","pos":"adj","level":"a2","mnemonic":"«дёйделэйк» созвучно с «дуй, делай» — всё ясно, дуй и делай","story":"«Дуй и делай, всё ясно!» — duidelijk, «понятный»."," function t(key, ...args){
  const dict = STRINGS[STATE.settings.lang] || STRINGS.ru;
  const v = dict[key];
  if(typeof v === 'function') return v(...args);
  return v !== undefined ? v : (STRINGS.ru[key] || key);
}

/* ================= STORAGE (localStorage, fully offline) ================= */
const LS_PREFIX = 'tm_easy_dutch_';
let localStorageOk = true;
try{
  localStorage.setItem(LS_PREFIX+'_probe','1');
  localStorage.removeItem(LS_PREFIX+'_probe');
}catch(e){ localStorageOk = false; }

const memoryFallback = {};
function lsGet(key){
  if(!localStorageOk) return memoryFallback[key] || null;
  try{ return localStorage.getItem(LS_PREFIX+key); }catch(e){ return memoryFallback[key] || null; }
}
function lsSet(key, val){
  if(!localStorageOk){ memoryFallback[key] = val; return false; }
  try{ localStorage.setItem(LS_PREFIX+key, val); return true; }catch(e){ memoryFallback[key] = val; return false; }
}

function saveCore(){
  const ok = lsSet('core', JSON.stringify({
    settings: STATE.settings, progress: STATE.progress, manual: STATE.manual,
    overrides: STATE.overrides, daily: STATE.daily
  }));
  if(!ok) toast(t('storageWarn'));
}
function loadCore(){
  const raw = lsGet('core');
  if(!raw) return null;
  try{ return JSON.parse(raw); }catch(e){ return null; }
}

let STATE = {
  settings: { newPerDay: 10, lang: 'ru', studyLang: 'ru', unlockedBatches: [1] },
  progress: {},     // id -> {status,interval,ease,due,reps,lapses,knowStreak}
  manual: [],       // user-added words, full records
  overrides: {},    // id -> partial edits for built-in words
  daily: { date: '', count: 0, reviewedIds: [] }
};

let WORDS = []; // unified: {id, nl, en, source}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function buildWordList(){
  const unlocked = new Set(STATE.settings.unlockedBatches || [1]);
  WORDS = DUTCH_WORDS.filter(w=>unlocked.has(w.batch||1)).map(w=>({id:w.id, nl:w.nl, en:w.en, source:'builtin'}));
  STATE.manual.forEach(w=>{ WORDS.push({id:w.id, nl:w.nl, en:w.en||'', source:'manual'}); });
}

function unlockNextBatch(){
  const current = STATE.settings.unlockedBatches || [1];
  const nextBatch = Math.max(...current) + 1;
  if(nextBatch > MAX_BATCH) return false;
  STATE.settings.unlockedBatches = current.concat([nextBatch]);
  saveCore();
  buildWordList();
  refreshStats();
  return true;
}

function nextBatchWordCount(){
  const current = STATE.settings.unlockedBatches || [1];
  const nextBatch = Math.max(...current) + 1;
  if(nextBatch > MAX_BATCH) return 0;
  return DUTCH_WORDS.filter(w=>w.batch===nextBatch).length;
}

function getWordData(id){
  if(BUILTIN_BY_ID[id]){
    const base = BUILTIN_BY_ID[id];
    const ov = STATE.overrides[id];
    return ov ? Object.assign({}, base, ov) : base;
  }
  return STATE.manual.find(w=>w.id===id) || {};
}

function getCard(id){
  return STATE.progress[id] || {status:'new', interval:0, ease:2.5, due:0, reps:0, lapses:0, knowStreak:0};
}

/* ================= INIT ================= */
function init(){
  const core = loadCore();
  if(core){
    STATE.settings = Object.assign(STATE.settings, core.settings || {});
    STATE.progress = core.progress || {};
    STATE.manual = core.manual || [];
    STATE.overrides = core.overrides || {};
    STATE.daily = core.daily || {date:'', count:0, reviewedIds:[]};
  }
  if(!STATE.daily.reviewedIds) STATE.daily.reviewedIds = [];
  if(STATE.daily.date !== todayStr()){
    STATE.daily = {date: todayStr(), count:0, reviewedIds:[]};
    saveCore();
  }
  if(!localStorageOk) toast(t('localStorageFailWarn'));
  buildWordList();
  applyLangToStaticUI();
  refreshStats();
  renderTab('study');
}

function applyLangToStaticUI(){

let studyQueue = [];

function buildQueue(){
  const now = Date.now();
  const due = [];
  const fresh = [];
  WORDS.forEach(w=>{
    const c = getCard(w.id);
    if(c.status==='new') fresh.push(w);
    else if(c.due<=now) due.push(w);
  });
  const remaining = Math.max(0, STATE.settings.newPerDay - STATE.daily.count);
  const freshCapped = fresh.slice(0, remaining);
  studyQueue = due.concat(freshCapped);
  studyIndex = 0;
  replayMode = false;
}

  main.innerHTML = `<div class="deck-wrap" id="deckWrap"></div>`;

function grade(w, g){
  if(!STATE.daily.reviewedIds.includes(w.id)) STATE.daily.reviewedIds.push(w.id);

  if(!replayMode){
    const c = getCard(w.id);
    const wasNew = c.status === 'new';
    let {interval, ease, reps, lapses, knowStreak} = c;
    ease = ease || 2.5;
    interval = interval || 0;
    knowStreak = knowStreak || 0;
    let justMastered = false;

    if(g==='again'){
      ease = Math.max(1.3, ease - 0.2);
      interval = 0;
      lapses = (lapses||0) + (c.status==='review' ? 1 : 0);
      c.status = 'learning';
      knowStreak = 0;
    } else if(g==='good'){
      interval = (c.status==='new' || c.status==='learning') ? 1 : Math.max(1, Math.round(interval * ease));
      c.status = 'review';
      reps = (reps||0) + 1;
      knowStreak = 0;
    } else if(g==='easy'){
      ease = Math.min(3.0, ease + 0.15);
      knowStreak += 1;
      if(knowStreak >= 5){
        // Mastered: push far out so it stops competing with less-known words.
        interval = Math.max(interval * 3, 60);
        justMastered = true;
      } else {
        interval = (c.status==='new' || c.status==='learning') ? 4 : Math.max(1, Math.round(interval * ease * 1.3));
      }
      c.status = 'review';
      reps = (reps||0) + 1;
    }

    const dueMs = g==='again' ? Date.now() + 5*60*1000 : Date.now() + interval*24*60*60*1000;
    STATE.progress[w.id] = {status:c.status, interval, ease, due:dueMs, reps, lapses, knowStreak};

    if(wasNew && g!=='again') STATE.daily.count += 1;
    if(g==='again') studyQueue.push(w);
    if(justMastered) toast(t('masteredToast'));
  }

  saveCore();
  studyIndex++;
  renderCurrentCard();
  refreshStats();
}

function startReplay(){
  const ids = STATE.daily.reviewedIds;
  studyQueue = ids.map(id=>WORDS.find(w=>w.id===id)).filter(Boolean);
  studyIndex = 0;
  replayMode = true;
  renderCurrentCard();
}

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ================= OPTIONAL ONLINE AI-ASSIST (used only when explicitly requested) ================= */
async function generateMnemonic(nl, en){
  const studyLangNote = STATE.settings.studyLang === 'en'
    ? 'Пользователь ориентируется на английский перевод, но созвучие подбирай по звучанию — можно на русском или английском, смотря что звучит точнее.'
    : 'Пользователь ориентируется на русский перевод, но созвучие подбирай по звучанию — можно на русском или английском, смотря что звучит точнее.';
  const sys = `Ты помогаешь пользователю запоминать голландские слова (уровень A2-B2) методом фонетических ассоциаций (созвучий). Для голландского слова дай: 1) точный перевод на русский (1-4 слова), 2) созвучие — русское или английское слово/фраза, звучащая похоже на голландское слово, 3) короткую яркую мини-историю ВСЕГДА НА РУССКОМ (1-2 предложения), которая связывает созвучие со значением слова, 4) если слово существительное — артикль (de или het), иначе null, 5) короткий естественный пример предложения на голландском уровня A2-B2 с этим словом, 6) перевод примера на русский, 7) перевод примера на английский. ${studyLangNote} Отвечай СТРОГО в формате JSON без markdown и пояснений: {"ru":"...","mnemonic":"...","story":"...","article":"de"|"het"|null,"example_nl":"...","example_ru":"...","example_en":"..."}`;
  const userMsg = `Голландское слово: "${nl}"${en ? ' (примерный смысл по-английски: '+en+')' : ''}`;
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 1000, system: sys, messages: [{role:"user", content: userMsg}] })
  });
  const data = await response.json();
  const text = (data.content||[]).map(b=>b.text||'').join('').trim();
  const clean = text.replace(/```json|```/g,'').trim();
  const parsed = JSON.parse(clean);
  return {
    ru: parsed.ru || '', mnemonic: parsed.mnemonic || '', story: parsed.story || '', article: parsed.article || null,
    example_nl: parsed.example_nl || '', example_ru: parsed.example_ru || '', example_en: parsed.example_en || ''
  };
}

/* ================= ANCHOR TEST (standalone activity) ================= */
let anchorPool = [];
let anchorIdx = 0;
let anchorScore = {right:0, wrong:0};

function escapeRegExp(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function stripWord(text, word){
  if(!text || !word) return text;
  const re = new RegExp('\\b' + escapeRegExp(word) + '\\b', 'gi');
  return text.replace(re, '…');
}

function stripGiveaways(text, nl, en){
  let out = stripWord(text, nl);
  if(en){
    out = stripWord(out, en);
    const enNoTo = en.replace(/^to\s+/i, '');
    if(enNoTo !== en) out = stripWord(out, enNoTo);
  }
  return out.replace(/\s{2,}/g, ' ').trim();
}

function buildAnchorPool(){
  // Only quiz on words the learner has actually started studying (not brand-new/unseen).
  const studied = WORDS.filter(w=>getCard(w.id).status !== 'new');
  const allWithStory = WORDS.map(w=>({w, m:getWordData(w.id)})).filter(x=>x.m.story);
  const studiedWithStory = studied.map(w=>({w, m:getWordData(w.id)})).filter(x=>x.m.story);

  anchorPool = studiedWithStory.map(({w,m})=>{
    let decoy;
    do { decoy = allWithStory[Math.floor(Math.random()*allWithStory.length)]; } while(decoy.w.id===w.id && allWithStory.length>1);
    const correctIsA = Math.random() < 0.5;
    const ownStripped = stripGiveaways(m.story, w.nl, w.en);
    const decoyStripped = stripGiveaways(decoy.m.story, decoy.w.nl, decoy.w.en);
    return {
      nl: w.nl,
      optionA: correctIsA ? ownStripped : decoyStripped,
      optionB: correctIsA ? decoyStripped : ownStripped,
      correct: correctIsA ? 'A' : 'B'
    };
  });
  for(let i=anchorPool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [anchorPool[i],anchorPool[j]]=[anchorPool[j],anchorPool[i]]; }
  anchorIdx = 0;
  anchorScore = {right:0, wrong:0};
}

function renderAnchorTest(main){
  buildAnchorPool();
  main.innerHTML = `<div class="deck-wrap" id="anchorWrap"></div>`;
  renderAnchorCard();
}

function renderAnchorCard(){
  const wrap = document.getElementById('anchorWrap');
  if(!wrap) return;
  if(anchorPool.length===0){
    wrap.innerHTML = `<div class="empty-state"><div class="big">🧩</div><div class="muted">${t('anchorEmpty')}</div></div>`;
    return;
  }
  if(anchorIdx >= anchorPool.length){
    wrap.innerHTML = `<div class="empty-state"><div class="big">🧩</div>
      <div style="font-family:var(--font-display);font-size:19px;color:var(--delft-deep);margin-bottom:6px;">${t('anchorDone')}</div>
      <div class="muted">${t('dehetRight')}: ${anchorScore.right} · ${t('dehetWrong')}: ${anchorScore.wrong}</div>
      <div style="margin-top:16px;"><button class="btn btn-primary" id="restartAnchor">${t('dehetRestart')}</button></div>
    </div>`;
    document.getElementById('restartAnchor').addEventListener('click', ()=>{ buildAnchorPool(); renderAnchorCard(); });
    return;
  }
  const item = anchorPool[anchorIdx];
  wrap.innerHTML = `
    <div class="progress-line"><span>${anchorIdx+1} / ${anchorPool.length}</span><span>✓ ${anchorScore.right} · ✗ ${anchorScore.wrong}</span></div>
    <div class="tile-card">
      ${tileCornerSvg()}
      <div class="card-body" style="align-items:stretch;">
        <div class="pos-tag" style="text-align:center;">${t('anchorTestQuestion')}</div>
        <div class="nl-word" style="text-align:center;margin-bottom:14px;">${escapeHtml(item.nl)}</div>
        <button class="btn btn-ghost" style="text-align:left;white-space:normal;height:auto;padding:11px 13px;margin-bottom:8px;" id="optA">А) ${escapeHtml(item.optionA)}</button>
        <button class="btn btn-ghost" style="text-align:left;white-space:normal;height:auto;padding:11px 13px;" id="optB">Б) ${escapeHtml(item.optionB)}</button>
        <div id="anchorFeedback" style="margin-top:12px;font-weight:700;text-align:center;"></div>
      </div>
    </div>
  `;
  const check = (pick)=>{
    const fb = document.getElementById('anchorFeedback');
    const correct = pick === item.correct;
    if(correct){ anchorScore.right++; fb.style.color='var(--good)'; fb.textContent = t('anchorCorrect'); }
    else { anchorScore.wrong++; fb.style.color='var(--bad)'; fb.textContent = t('anchorWrong') + ' ' + (item.correct==='A'?'А':'Б'); }
    document.getElementById('optA').disabled = true;
    document.getElementById('optB').disabled = true;
    setTimeout(()=>{ anchorIdx++; renderAnchorCard(); }, 1400);
  };
  document.getElementById('optA').addEventListener('click', ()=>check('A'));
  document.getElementById('optB').addEventListener('click', ()=>check('B'));
}

/* ================= DE / HET TRAINER ================= */
let dehetPool = [];
let dehetIdx = 0;
let dehetScore = {right:0, wrong:0};

function buildDehetPool(){
  const pool = [];
  WORDS.forEach(w=>{
    const m = getWordData(w.id);
    if(m.article==='de' || m.article==='het') pool.push({nl:w.nl, article:m.article});
  });
  dehetPool = pool;
  for(let i=dehetPool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [dehetPool[i],dehetPool[j]]=[dehetPool[j],dehetPool[i]]; }
  dehetIdx = 0;
  dehetScore = {right:0, wrong:0};
}

function renderDehet(main){
  buildDehetPool();
  main.innerHTML = `<div class="deck-wrap" id="dehetWrap"></div>`;
  renderDehetCard();
}

function renderDehetCard(){
  const wrap = document.getElementById('dehetWrap');
  if(!wrap) return;
  if(dehetPool.length===0){
    wrap.innerHTML = `<div class="empty-state"><div class="big">🎯</div><div class="muted">${t('dehetEmpty')}</div></div>`;
    return;
  }
  if(dehetIdx >= dehetPool.length){
    wrap.innerHTML = `<div class="empty-state"><div class="big">🎯</div>
      <div style="font-family:var(--font-display);font-size:19px;color:var(--delft-deep);margin-bottom:6px;">${t('dehetDone')}</div>
      <div class="muted">${t('dehetRight')}: ${dehetScore.right} · ${t('dehetWrong')}: ${dehetScore.wrong}</div>
      <div style="margin-top:16px;"><button class="btn btn-primary" id="restartDehet">${t('dehetRestart')}</button></div>
    </div>`;
    document.getElementById('restartDehet').addEventListener('click', ()=>{ buildDehetPool(); renderDehetCard(); });
    return;
  }
  const item = dehetPool[dehetIdx];
  wrap.innerHTML = `
    <div class="progress-line"><span>${dehetIdx+1} / ${dehetPool.length}</span><span>✓ ${dehetScore.right} · ✗ ${dehetScore.wrong}</span></div>
    <div class="tile-card">
      ${tileCornerSvg()}
      <div class="card-body">
        <div class="pos-tag">${t('dehetTitle')}</div>
        <div class="nl-word">${escapeHtml(item.nl)}</div>
        <div class="grade-row" style="margin-top:26px;">
          <button class="grade-btn g-good" id="pickDe" style="background:var(--delft-mid)">de</button>
          <button class="grade-btn g-easy" id="pickHet" style="background:var(--ochre)">het</button>
        </div>
        <div id="dehetFeedback" style="margin-top:14px; font-weight:700;"></div>
      </div>
    </div>
  `;
  document.getElementById('pickDe').addEventListener('click', ()=>answerDehet('de', item));
  document.getElementById('pickHet').addEventListener('click', ()=>answerDehet('het', item));
}

function answerDehet(pick, item){
  const fb = document.getElementById('dehetFeedback');
  const correct = pick === item.article;
  if(correct){ dehetScore.right++; fb.style.color='var(--good)'; fb.textContent=(STATE.settings.lang==='en'?'Correct! ':'Верно! ')+item.article+' '+item.nl; }
  else { dehetScore.wrong++; fb.style.color='var(--bad)'; fb.textContent=(STATE.settings.lang==='en'?'Correct answer: ':'Правильно: ')+item.article+' '+item.nl; }
  document.getElementById('pickDe').disabled = true;
  document.getElementById('pickHet').disabled = true;
  setTimeout(()=>{ dehetIdx++; renderDehetCard(); }, 900);
}

function buildBackupPayload(){
  return {
    settings: STATE.settings, progress: STATE.progress, manual: STATE.manual,
    overrides: STATE.overrides, daily: STATE.daily, exportedAt: new Date().toISOString()
  };
}

function applyBackupPayload(payload){
  if(payload.settings) STATE.settings = Object.assign(STATE.settings, payload.settings);
  if(payload.progress) STATE.progress = Object.assign(STATE.progress, payload.progress);
  if(payload.overrides) STATE.overrides = Object.assign(STATE.overrides, payload.overrides);
  if(payload.manual){
    const existingIds = new Set(STATE.manual.map(x=>x.id));
    payload.manual.forEach(w=>{ if(!existingIds.has(w.id)) STATE.manual.push(w); });
  }
  saveCore();
  buildWordList();
  refreshStats();
}

function copyTextFallback(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){ ok = false; }
  document.body.removeChild(ta);
  return ok;
}

async function doCopyCode(){
  const text = JSON.stringify(buildBackupPayload());
  let ok = false;
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
      ok = true;
    }
  }catch(e){ ok = false; }
  if(!ok) ok = copyTextFallback(text);
  toast(ok ? t('copiedToast') : t('copyFailedToast'));
}

function doImportFromText(){
  const raw = document.getElementById('pasteCodeArea').value.trim();
  if(!raw){ toast(t('pasteEmptyToast')); return; }
  try{
    const payload = JSON.parse(raw);
    applyBackupPayload(payload);
    toast(t('importedToast'));
    renderTab('settings');
  }catch(e){
    toast(t('importErrToast'));
  }
}

function doExport(){
  const payload = buildBackupPayload();
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'tm-easy-dutch-backup-'+todayStr()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast(t('exportedToast'));
}

function doImport(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const payload = JSON.parse(ev.target.result);
      applyBackupPayload(payload);
      toast(t('importedToast'));
    }catch(err){ toast(t('importErrToast')); }
  };
  reader.readAsText(file);
}

function doReset(){
  if(!confirm(t('resetConfirm'))) return;
  STATE.progress = {};
  STATE.daily = {date: todayStr(), count:0, reviewedIds:[]};
  saveCore();
  refreshStats();
  toast(t('resetToast'));
  renderTab('study');
}
